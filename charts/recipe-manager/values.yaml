replicasCount: 1

image:
  pullPolicy: Always
  registry: docker.io

ui:
  port: 80
  image:
    name: "ottenwbe/recipes-manager-ui"
    registry: ""
    tag: "latest"
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi
  strings: |
    {"appName": "BELA Recipes","pageHeaderSub" : "Enjoy delicous recipes","footerText": "That's all folks ...","welcome" : "Welcome to BELA Recipes","welcomesSub" : "Enjoy the delicious Recipe", "recipesPageHeading" : "Recipes", "recipeFormTitle" : "Title"}

recipesManager:
  config:
    log: debug
    # Assuming the app expects MONGO_URL or similar via env
    databaseUrl: "mongodb://db:27017"
  port: 8080
  image:
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  drive:
    secrets: ""

recommender:
  port: 5000
  image:
    tag: "latest"
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 300Mi  
    
db:
  size: "5Gi"
  port: 27017
  image:
    registry: docker.io
    name: mongo
    tag: 7
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 300Mi    

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
        - path: /api
          pathType: ImplementationSpecific
  tls: []

resources: 
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
