apiVersion: v1
kind: ConfigMap
metadata:
  name: recipes-manager-config
data:
  recipes-manager-config.yml: |
    recipeDB:
      host: mongodb://db-service:{{ .Values.db.port | default "27017" }}
    html:
      address: ":{{ .Values.recipesManager.port | default "8080" }}"
      cors:
        origin: "*"
    log:
      level: {{ .Values.recipesManager.config.log | default "debug" }}
    drive:
      enabled: false
    keycloak:
      enabled: false
